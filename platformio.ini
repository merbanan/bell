; ESP8266 UART-over-Telnet server with web configuration UI
;
; Build:  pio run -e nodemcuv2
; Upload: pio run -e nodemcuv2 -t upload
;
; Flash layout is the stock 4 MB / 1 MB one the ESP8266 core uses with this
; board (eagle.flash.4m1m.ld):
;
;   0x00000  system (rf cal, wifi params, blank nvs)
;   0x01000  sketch          - about 1019 kB
;   0x30000  LittleFS        - 1000 kB, holds config.json
;
; Over-the-air updates do not need a second slot: the ESP8266 core writes the
; new image so that it ends where LittleFS begins, and records the address in an
; eBoot command the bootloader reads. OTA_SLOT_BYTES in src/bell.h caps how
; large that image may be; see the comment there.

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=0     ; UART0 carries the payload, never debug output
    -D NDEBUG
    -D DEFAULT_TELNET_PORT=12345
    -D DEFAULT_TELNET_PORT_RO=12346
    -D WEB_PORT=80
    -D MAX_TELNET_CLIENTS=4

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
upload_speed = 921600
